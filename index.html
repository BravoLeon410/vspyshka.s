<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ВСПЫШКА — Мессенджер</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --surface-color: #1a2230;
            --surface-hover: #242f42;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d3748;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --bubble-out: #4f46e5;
            --bubble-in: #222e3c;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app {
                height: 90vh;
                border-radius: var(--radius);
                border: 1px solid var(--border-color);
            }
        }

        /* Экраны */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .screen.active {
            transform: translateX(0);
        }

        /* Шапка */
        .header {
            padding: 16px 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 64px;
            z-index: 5;
        }

        .header h1, .header h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--surface-hover);
        }

        /* Кнопки и формы */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--surface-hover);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        /* Авторизация / Регистрация */
        .auth-container {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .auth-container h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .auth-container input {
            margin-bottom: 16px;
            text-align: center;
        }

        /* Список чатов */
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(45, 55, 72, 0.4);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: var(--surface-hover);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #818cf8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .chat-last-message {
            font-size: 14px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Экран чата */
        .messages-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-color);
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background-color: var(--bubble-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background-color: var(--bubble-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        .message.incoming .message-meta {
            color: var(--text-muted);
        }

        /* Поле ввода сообщения */
        .chat-input-area {
            padding: 12px 16px;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            border-radius: 24px;
            padding: 10px 18px;
        }

        /* Дизайнерские кастомные модальные окна / контекстные меню (вместо стандартных alert/prompt) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 85%;
            max-width: 340px;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-body {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Контекстное меню для сообщений (красивое кастомное меню вместо браузерного) */
        .action-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--surface-color);
            border-top-left-radius: var(--radius);
            border-top-right-radius: var(--radius);
            border-top: 1px solid var(--border-color);
            padding: 16px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 150;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .action-sheet.active {
            transform: translateY(0);
        }

        .action-sheet-btn {
            background: var(--bg-color);
            border: none;
            color: var(--text-main);
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }

        .action-sheet-btn:hover {
            background-color: var(--surface-hover);
        }

        .action-sheet-btn.danger {
            color: var(--danger-color);
        }

        /* Плавающая кнопка создания чата */
        .fab {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, background 0.2s;
            z-index: 4;
        }

        .fab:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        /* Уведомления (тосты) */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background-color: var(--surface-hover);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Уведомления -->
        <div id="toast" class="toast">Уведомление</div>

        <!-- Экран авторизации -->
        <div id="authScreen" class="screen active">
            <div class="auth-container">
                <h2>ВСПЫШКА</h2>
                <p>Быстрый и защищенный мессенджер</p>
                <input type="text" id="usernameInput" placeholder="Введите ваш @username" autocomplete="off">
                <button class="btn" id="loginBtn">Войти в систему</button>
            </div>
        </div>

        <!-- Экран списка чатов -->
        <div id="chatsScreen" class="screen">
            <div class="header">
                <h2>Чаты</h2>
                <button class="icon-btn" id="profileBtn" title="Профиль">⚙️</button>
            </div>
            <div class="chats-list" id="chatsList">
                <!-- Список чатов рендерится динамически -->
            </div>
            <button class="fab" id="newChatBtn" title="Новый чат">➕</button>
        </div>

        <!-- Экран активного чата -->
        <div id="chatScreen" class="screen">
            <div class="header">
                <button class="icon-btn" id="backToChatsBtn">⬅️</button>
                <h2 id="activeChatTitle">Имя чата</h2>
                <button class="icon-btn" id="chatMenuBtn">⋮</button>
            </div>
            <div class="messages-container" id="messagesContainer">
                <!-- Сообщения рендерятся динамически -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
                <button class="btn" id="sendMessageBtn">➤</button>
            </div>
        </div>

        <!-- Кастомное модальное окно для ввода (вместо системного prompt) -->
        <div id="customModal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-title" id="modalTitle">Заголовок</div>
                <div class="modal-body" id="modalBodyText">
                    <input type="text" id="modalInput" placeholder="Введите значение..." style="margin-top: 10px;">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="modalCancelBtn">Отмена</button>
                    <button class="btn" id="modalConfirmBtn">OK</button>
                </div>
            </div>
        </div>

        <!-- Кастомное контекстное меню для сообщений (вместо браузерного меню) -->
        <div id="actionSheetOverlay" class="modal-overlay" style="align-items: flex-end; background-color: rgba(0,0,0,0.5);">
            <div class="action-sheet" id="actionSheet">
                <button class="action-sheet-btn" id="editMsgBtn">✏️ Редактировать сообщение</button>
                <button class="action-sheet-btn danger" id="deleteMsgBtn">🗑️ Удалить сообщение</button>
                <button class="action-sheet-btn btn-secondary" id="cancelActionBtn" style="text-align: center; justify-content: center; margin-top: 8px;">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // Состояние приложения
        let currentUser = localStorage.getItem('vspyshka_user') || '';
        let chats = JSON.parse(localStorage.getItem('vspyshka_chats') || '[]');
        let activeChatId = null;
        let selectedMessageId = null;
        let editingMessageId = null;

        // DOM элементы
        const authScreen = document.getElementById('authScreen');
        const chatsScreen = document.getElementById('chatsScreen');
        const chatScreen = document.getElementById('chatScreen');
        
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const chatsList = document.getElementById('chatsList');
        const newChatBtn = document.getElementById('newChatBtn');
        const profileBtn = document.getElementById('profileBtn');
        
        const backToChatsBtn = document.getElementById('backToChatsBtn');
        const activeChatTitle = document.getElementById('activeChatTitle');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalInput = document.getElementById('modalInput');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');

        const actionSheetOverlay = document.getElementById('actionSheetOverlay');
        const actionSheet = document.getElementById('actionSheet');
        const editMsgBtn = document.getElementById('editMsgBtn');
        const deleteMsgBtn = document.getElementById('deleteMsgBtn');
        const cancelActionBtn = document.getElementById('cancelActionBtn');
        const toast = document.getElementById('toast');

        // Уведомления
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Инициализация при загрузке
        if (currentUser) {
            authScreen.classList.remove('active');
            chatsScreen.classList.add('active');
            renderChats();
        }

        // Авторизация
        loginBtn.addEventListener('click', () => {
            const val = usernameInput.value.trim().replace('@', '');
            if (!val) {
                showToast('Введите имя пользователя!');
                return;
            }
            currentUser = '@' + val;
            localStorage.setItem('vspyshka_user', currentUser);
            authScreen.classList.remove('active');
            chatsScreen.classList.add('active');
            renderChats();
        });

        // Переключение экранов
        function switchScreen(from, to) {
            from.classList.remove('active');
            to.classList.add('active');
        }

        // Рендер списка чатов
        function renderChats() {
            chatsList.innerHTML = '';
            if (chats.length === 0) {
                chatsList.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-muted);">Нет активных чатов.<br>Нажмите + чтобы начать общение.</div>`;
                return;
            }

            chats.forEach(chat => {
                const lastMsg = chat.messages && chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].text : 'Нет сообщений';
                const lastTime = chat.messages && chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].time : '';

                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <div class="avatar">${chat.name.charAt(1).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name} <span class="chat-time">${lastTime}</span></div>
                        <div class="chat-last-message">${lastMsg}</div>
                    </div>
                `;
                div.addEventListener('click', () => openChat(chat.id));
                chatsList.appendChild(div);
            });
        }

        // Создание нового чата через красивое модальное окно вместо prompt
        newChatBtn.addEventListener('click', () => {
            openModal('Новый чат', 'Введите @username собеседника:', (val) => {
                let username = val.trim();
                if (!username) return;
                if (!username.startsWith('@')) username = '@' + username;
                
                if (username === currentUser) {
                    showToast('Нельзя создать чат с самим собой');
                    return;
                }

                let existing = chats.find(c => c.name === username);
                if (!existing) {
                    existing = {
                        id: Date.now().toString(),
                        name: username,
                        messages: []
                    };
                    chats.push(existing);
                    saveChats();
                }
                renderChats();
                openChat(existing.id);
            });
        });

        // Открытие чата
        function openChat(chatId) {
            activeChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            activeChatTitle.textContent = chat.name;
            renderMessages(chat);
            chatsScreen.classList.remove('active');
            chatScreen.classList.add('active');
        }

        backToChatsBtn.addEventListener('click', () => {
            chatScreen.classList.remove('active');
            chatsScreen.classList.add('active');
            renderChats();
        });

        // Рендер сообщений
        function renderMessages(chat) {
            messagesContainer.innerHTML = '';
            if (!chat.messages || chat.messages.length === 0) {
                messagesContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: auto; margin-bottom: auto; font-size: 14px;">История сообщений пуста</div>`;
                return;
            }

            chat.messages.forEach(msg => {
                const isOut = msg.sender === currentUser;
                const div = document.createElement('div');
                div.className = `message ${isOut ? 'outgoing' : 'incoming'}`;
                div.innerHTML = `
                    <div>${escapeHtml(msg.text)}</div>
                    <div class="message-meta">
                        ${msg.edited ? '<span>(изменено)</span>' : ''}
                        <span>${msg.time}</span>
                    </div>
                `;

                // Долгое нажатие или клик для вызова кастомного меню редактирования/удаления своих сообщений
                if (isOut) {
                    div.style.cursor = 'pointer';
                    div.title = 'Нажмите, чтобы изменить или удалить';
                    div.addEventListener('click', () => {
                        selectedMessageId = msg.id;
                        openActionSheet();
                    });
                }

                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Отправка сообщения
        function handleSend() {
            const text = messageInput.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === activeChatId);
            if (!chat) return;

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            if (editingMessageId) {
                // Режим сохранения отредактированного сообщения
                const msg = chat.messages.find(m => m.id === editingMessageId);
                if (msg) {
                    msg.text = text;
                    msg.edited = true;
                    msg.time = timeStr;
                }
                editingMessageId = null;
                sendMessageBtn.textContent = '➤';
            } else {
                // Обычная отправка
                if (!chat.messages) chat.messages = [];
                chat.messages.push({
                    id: Date.now().toString(),
                    sender: currentUser,
                    text: text,
                    time: timeStr,
                    edited: false
                });
            }

            messageInput.value = '';
            saveChats();
            renderMessages(chat);
        }

        sendMessageBtn.addEventListener('click', handleSend);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Управление модальным окном ввода
        let modalCallback = null;
        function openModal(title, placeholder, callback) {
            modalTitle.textContent = title;
            modalInput.placeholder = placeholder;
            modalInput.value = '';
            modalCallback = callback;
            customModal.classList.add('active');
            setTimeout(() => modalInput.focus(), 100);
        }

        modalCancelBtn.addEventListener('click', () => {
            customModal.classList.remove('active');
        });

        modalConfirmBtn.addEventListener('click', () => {
            const val = modalInput.value;
            customModal.classList.remove('active');
            if (modalCallback) modalCallback(val);
        });

        modalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                modalConfirmBtn.click();
            }
        });

        // Управление контекстным Action Sheet меню (вместо стандартного браузерного)
        function openActionSheet() {
            actionSheetOverlay.classList.add('active');
            actionSheet.classList.add('active');
        }

        function closeActionSheet() {
            actionSheet.classList.remove('active');
            actionSheetOverlay.classList.remove('active');
        }

        cancelActionBtn.addEventListener('click', closeActionSheet);
        actionSheetOverlay.addEventListener('click', (e) => {
            if (e.target === actionSheetOverlay) closeActionSheet();
        });

        // Действие: Редактировать
        editMsgBtn.addEventListener('click', () => {
            closeActionSheet();
            const chat = chats.find(c => c.id === activeChatId);
            if (!chat) return;
            const msg = chat.messages.find(m => m.id === selectedMessageId);
            if (msg) {
                messageInput.value = msg.text;
                editingMessageId = msg.id;
                sendMessageBtn.textContent = '💾';
                messageInput.focus();
                showToast('Режим редактирования сообщения');
            }
        });

        // Действие: Удалить
        deleteMsgBtn.addEventListener('click', () => {
            closeActionSheet();
            const chat = chats.find(c => c.id === activeChatId);
            if (!chat) return;
            chat.messages = chat.messages.filter(m => m.id !== selectedMessageId);
            saveChats();
            renderMessages(chat);
            showToast('Сообщение удалено');
        });

        // Кнопка настроек профиля
        profileBtn.addEventListener('click', () => {
            openModal('Настройки профиля', 'Ваш текущий username', (val) => {
                if (!val.trim()) return;
                let newName = val.trim();
                if (!newName.startsWith('@')) newName = '@' + newName;
                currentUser = newName;
                localStorage.setItem('vspyshka_user', currentUser);
                showToast('Профиль обновлен: ' + currentUser);
            });
            modalInput.value = currentUser;
        });

        function saveChats() {
            localStorage.setItem('vspyshka_chats', JSON.stringify(chats));
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
